name: property_investment_calculator
description: "Property Investment Calculator - analyze property buying, renting, financing, holding and selling decisions."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management & Typography
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1

  # Local storage (offline-first)
  shared_preferences: ^2.2.3
  sqflite: ^2.3.0
  path: ^1.9.0

  # IDs
  uuid: ^4.4.0

  # Formatting
  intl: ^0.20.3

  # Charts (yield / ROI / appreciation visuals)
  fl_chart: ^0.68.0

  # PDF report generation + sharing
  pdf: ^3.11.0
  printing: ^5.15.0
  share_plus: ^10.0.0
  path_provider: ^2.1.3

  # Forms
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
